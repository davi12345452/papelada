name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install fonts used by the renderer
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run pytest -q
