[project]
name = "papelada"
version = "0.0.1"
description = "Benchmark for structured data extraction from Brazilian documents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "faker>=30",
    "jsonschema>=4.23",
    "numpy>=2.0",
    "pillow>=11.0",
]

[project.scripts]
papelada = "papelada.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papelada"]

[tool.pytest.ini_options]
testpaths = ["tests"]
